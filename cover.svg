<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <radialGradient id="blob1" cx="20%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blob2" cx="80%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#blob1)" />
  <rect width="1200" height="630" fill="url(#blob2)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Code Frame / Glassmorphism Mockup Box -->
  <g transform="translate(100, 75)">
    <!-- Card Background -->
    <rect width="1000" height="480" rx="24" fill="#0f172a" fill-opacity="0.75" stroke="#334155" stroke-width="1.5" />
    
    <!-- Window Controls -->
    <circle cx="40" cy="40" r="7" fill="#ef4444" />
    <circle cx="65" cy="40" r="7" fill="#f59e0b" />
    <circle cx="90" cy="40" r="7" fill="#10b981" />
    <text x="120" y="44" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="13">portfolio-website / index.html</text>

    <!-- Divider -->
    <line x1="0" y1="70" x2="1000" y2="70" stroke="#1e293b" stroke-width="1.5" />

    <!-- Status Badge -->
    <g transform="translate(60, 115)">
      <rect width="250" height="34" rx="17" fill="#6366f1" fill-opacity="0.12" stroke="#6366f1" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="18" cy="17" r="4.5" fill="#10b981" />
      <text x="32" y="22" fill="#818cf8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="12" letter-spacing="1">AVAILABLE FOR ROLES</text>
    </g>

    <!-- Main Heading -->
    <text x="60" y="210" fill="#ffffff" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="800" font-size="52" letter-spacing="-1">
      Khushi Sharma
    </text>

    <!-- Subtitle with Gradient -->
    <text x="60" y="260" fill="url(#primaryGrad)" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="700" font-size="30">
      Software Developer &amp; Tech Innovator
    </text>

    <!-- Description -->
    <text x="60" y="305" fill="#94a3b8" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="400" font-size="18">
      Building scalable, responsive, and high-impact web applications with clean code.
    </text>

    <!-- Skill Tags -->
    <g transform="translate(60, 360)">
      <!-- Tag 1 -->
      <g transform="translate(0, 0)">
        <rect width="115" height="36" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="57" y="23" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="13" text-anchor="middle">JavaScript</text>
      </g>
      <!-- Tag 2 -->
      <g transform="translate(130, 0)">
        <rect width="90" height="36" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="45" y="23" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="13" text-anchor="middle">React</text>
      </g>
      <!-- Tag 3 -->
      <g transform="translate(235, 0)">
        <rect width="95" height="36" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="47" y="23" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="13" text-anchor="middle">Node.js</text>
      </g>
      <!-- Tag 4 -->
      <g transform="translate(345, 0)">
        <rect width="125" height="36" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="62" y="23" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="13" text-anchor="middle">Tailwind CSS</text>
      </g>
      <!-- Tag 5 -->
      <g transform="translate(485, 0)">
        <rect width="95" height="36" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="47" y="23" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="13" text-anchor="middle">Vercel</text>
      </g>
      <!-- Tag 6 -->
      <g transform="translate(595, 0)">
        <rect width="125" height="36" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="62" y="23" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="13" text-anchor="middle">Git &amp; GitHub</text>
      </g>
    </g>

    <!-- Bottom metadata info -->
    <g transform="translate(60, 435)">
      <text x="0" y="0" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="13">
        ⚡ github.com/sharmakhushi90123-boop
      </text>
      <text x="880" y="0" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="13" text-anchor="end">
        Handshake Portfolio Mission
      </text>
    </g>
  </g>
</svg>
